name: NuGet

# Publishes Mafesoft.VimeoClient when a version tag is pushed (git tag v3.4.0.3 && git push origin v3.4.0.3),
# or manually from Actions > NuGet > Run workflow. The version is the <Version> in VimeoClient.csproj.
# The tests run on every target framework (Windows) before the package is built and published.
#
# Authentication: NuGet Trusted Publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing),
# no long-lived API key. The NuGet/login step exchanges the GitHub OIDC token for a temporary API key (valid 1 hour).
# Requires:
# - on nuget.org (Account > Trusted Publishing) a policy with repository owner "fmazzant", repository "VimeoClient",
#   workflow file "nuget.yml" (renaming this file breaks publishing) and environment "production";
# - the GitHub environment "production" with the secret NUGET_USER: the nuget.org username (not the email)
#   of the user who created the policy.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:

    # Windows: the tests run on every target, .NET Framework included
    runs-on: windows-latest
    # Must match the environment of the NuGet Trusted Publishing policy
    environment: production
    permissions:
      contents: read
      id-token: write # needed by NuGet/login (Trusted Publishing)

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore src/VimeoClient.sln

    - name: Build
      run: dotnet build --no-restore -c Release src/VimeoClient.sln

    # The package is published only when all the tests pass
    - name: Test
      run: dotnet test --no-build -c Release src/VimeoClient.sln

    - name: Package
      run: dotnet pack --no-build -c Release -o . src/VimeoClient/VimeoClient.csproj

    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish on NuGet
      run: dotnet nuget push *.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
