# Dependabot version updates.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/VimeoClient"
      - "/tests/VimeoClient.Tests"
      - "/tests/VimeoClient.IntegrationTests"
      - "/samples/VimeoClientSampleApp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: [ "*" ]
